<!doctype html>
<html lang="fr" data-bs-theme="dark">

<head>
    <title>BlackJack</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="row topbar">
                <div class="col-2">
                    <div class="pill">Solde: <span id="Solde">200</span></div>
                </div>
                <div class="col-2">
                    <div class="pill">Mise: <span id="betCourrant"></span></div>
                </div>
            </div>

            <div class="row bet-row">
                <div class="offset-2 col-8">
                    <label for="betInput">Mise: </label>
                    <input type="number" min="5" max="200" step="5" value="10">
                    <button id="commencerTour">Nouvelle manche</button>
                </div>
            </div>

            <div class="row table">
                <section class="col-10 main">
                    <div class="hand-header">
                        <span>Croupier</span>
                        <span id="scoreCroupier">0</span>
                    </div>
                    <div id="cartesCroupier" class="cartes"></div>
                </section>

                <section class="col-10 main">
                    <div class="hand-header">
                        <span>Joueur</span>
                        <span id="scoreJoueur">0</span>
                    </div>
                    <div id="cartesJoueur" class="cartes"></div>
                </section>
            </div>

            <div class="row controles">
                <button id="hitBtn" disabled>Hit</button>
                <button id="standBtn" class="secondary" disabled>Stand</button>
            </div>

            <div class="row">
                <div id="status" class="offset-3 col-4 status">Place ta mise et lance une partie.</div>
            </div>
        </div>

    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
