<!doctype html>
<html lang="fr" data-bs-theme="dark">

<head>
    <title>BlackJack</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="container my-4">
            <!-- Barre supérieure (Solde & Mise en cours) -->
            <div class="row topbar">
                <div class="col-auto">
                    <div class="pill">Solde : <span id="Solde">200</span> €</div>
                </div>
                <div class="col-auto">
                    <div class="pill">Mise courante : <span id="betCourrant">0</span> €</div>
                </div>
            </div>

            <!-- Zone de Mise -->
            <div class="row bet-row my-3">
                <div class="col-auto d-flex align-items-center gap-2">
                    <label for="betInput" class="fw-bold">Mise :</label>
                    <input type="number" id="betInput" min="5" max="200" step="5" value="10">
                    <button id="commencerTour" class="btn-primary-custom">Nouvelle manche</button>
                </div>
            </div>

            <!-- Table de Jeu -->
            <div class="game-table">
                <!-- Main du Croupier -->
                <section class="main-zone">
                    <div class="hand-header">
                        <span>Croupier</span>
                        <span id="scoreCroupier" class="score-badge">0</span>
                    </div>
                    <div id="cartesCroupier" class="cartes"></div>
                </section>

                <!-- Main du Joueur -->
                <section class="main-zone">
                    <div class="hand-header">
                        <span>Joueur</span>
                        <span id="scoreJoueur" class="score-badge">0</span>
                    </div>
                    <div id="cartesJoueur" class="cartes"></div>
                </section>
            </div>

            <!-- Boutons d'Action -->
            <div class="row controles">
                <div class="col-12 d-flex justify-content-center gap-3 mt-3">
                    <button id="hitBtn" class="btn-action" disabled>Hit</button>
                    <button id="standBtn" class="btn-action secondary" disabled>Stand</button>
                </div>
            </div>

            <!-- Message de Statut -->
            <div class="row mt-3">
                <div class="col-12 text-center">
                    <div id="status" class="status">Place ta mise et lance une partie.</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
